[package]
name = "klassenwerk"
version = "1.1.0"
edition = "2021"
description = "Klassenwerk – Aufgabendatenbank, Klausurplaner und Notenbuch für Lehrkräfte"
license = "CC0-1.0"

[[bin]]
name = "Klassenwerk"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
roxmltree = "0.20"
cfb = "0.10"
rfd = "0.15"
# pictures from the clipboard (same version egui already uses)
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# reading Word files (.docx are zip archives); already used by the png decoder
miniz_oxide = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
# small program files: about 45 % smaller than plain opt-level 3, no noticeable speed difference
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
